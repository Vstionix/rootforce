events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # 1. Define CTFd Upstream Cluster (Load Balancer)
    upstream ctfd_cluster {
        # ip_hash ensures sticky user sessions (competitors stay logged in)
        ip_hash;

        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name rf.vstion.xyz localhost;

        client_max_body_size 100M;

        # 2. Proxy requests to CTFd Load Balancer
        location / {
            proxy_pass http://ctfd_cluster;
            
            # Preserve headers & Real IP from Cloudflare Tunnel
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 3. Enable WebSocket / EventSource support (required for CTFd live notifications)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Proxy Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # 4. Real-Time EventSource SSE Location (Instant Broadcast to All Devices)
        location /events {
            proxy_pass http://ctfd_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering "no";
        }

        # 5. Themes Proxy Location (No aggressive static caching)
        location /themes/ {
            proxy_pass http://ctfd_cluster;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
